<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SalárioPro | Dashboard</title>

<link rel="stylesheet" href="./assets/css/app.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <h1>SalárioPro</h1>
        <span>Controle Inteligente</span>
    </div>

    <nav>

        <button class="nav-item active">📊 Dashboard</button>
        <button class="nav-item">⏱ Apontamentos</button>
        <button class="nav-item">💰 Folha Prevista</button>
        <button class="nav-item">📁 Histórico</button>
        <button class="nav-item">⚙ Configurações</button>

    </nav>

</aside>

<!-- CONTEÚDO -->
<main class="main">

    <header class="topbar">

        <div>
            <h2>Dashboard Financeiro</h2>
            <p id="competenciaAtual">Carregando competência...</p>
        </div>

        <div class="status">
            🔵 Sistema Online
        </div>

    </header>

    <!-- KPIs -->
    <section class="grid">

        <div class="card">
            <h3>Horas Normais</h3>
            <p id="horasNormais">0h</p>
        </div>

        <div class="card blue">
            <h3>HE 60%</h3>
            <p id="he60">0h</p>
        </div>

        <div class="card purple">
            <h3>HE 70%</h3>
            <p id="he70">0h</p>
        </div>

        <div class="card orange">
            <h3>HE 100%</h3>
            <p id="he100">0h</p>
        </div>

        <div class="card red">
            <h3>Horas Faltantes</h3>
            <p id="faltantes">0h</p>
        </div>

        <div class="card green highlight">
            <h3>Líquido Previsto</h3>
            <p id="liquidoPrevisto">R$ 0,00</p>
        </div>

    </section>

</main>

</div>

<script src="./assets/js/database/indexeddb.js"></script>
<script src="./assets/js/modules/competencia.js"></script>
<script src="./assets/js/modules/horas.js"></script>
<script src="./assets/js/modules/folha.js"></script>
<script src="./assets/js/app.js"></script>

</body>

</html>
